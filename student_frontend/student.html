<!DOCTYPE html>
<html>
<head>
<title>Student Module</title>

<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    font-family: Arial;
    color: white;

    /* 🔥 FIXED GRADIENT ISSUE */
    background: linear-gradient(135deg, #0f172a, #2563eb);
    background-attachment: fixed;   /* ⭐ key fix */
    background-repeat: no-repeat;
    background-size: cover;
}

/* 🔥 TOP SECTION ONLY */
.top-section {
    display: flex;
    justify-content: center;   /* center horizontally */
    align-items: flex-start;   /* stay at top */

    height: 45vh;   /* only top portion */
}

/* MAIN CONTAINER */
.container {
    width: 650px;   /* 🔥 increased width */
    text-align: center;

    margin-top: 60px;   /* 🔥 controlled top spacing */
}

/* TITLE */
h1 {
    font-size: 34px;   /* 🔥 bigger title */
    margin-bottom: 25px;
}

/* MAIN BOX */
.box {
    background: rgba(255,255,255,0.08);
    padding: 30px;   /* 🔥 more spacing */
    border-radius: 14px;
}

/* INPUT FIELDS */
input {
    width: 90%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 6px;
    border: none;
}

/* BUTTONS */
button {
    margin: 10px;
    padding: 14px 24px;   /* 🔥 bigger buttons */
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 16px;   /* 🔥 bigger text */
}

button:hover {
    background: #1d4ed8;
}

/* SECTIONS */
.section {
    display: none;
    margin-top: 20px;
}

/* BACK BUTTON */
.back-btn {
    margin-top: 25px;
    padding: 12px 22px;
    font-size: 15px;
    background: #1e293b;
}

/* 🔥 BOTTOM SECTION (FUTURE AREA) */
.bottom-section {
    height: 55vh;
}

input[type="date"] {
    width: 90%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 6px;
    border: none;
    background: #e5e7eb;   /* same as other inputs */
    color: #000;
}

/* LIST CONTAINER */
#list {
    margin-top: 20px;
}

/* EACH STUDENT CARD */
.student-card {
    background: rgba(255,255,255,0.08);
    padding: 15px 20px;
    margin: 15px 0;
    border-radius: 10px;

    text-align: left;   /* 🔥 important fix */
    line-height: 1.6;

    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

/* TEXT SPACING */
.student-card p {
    margin: 4px 0;
}

</style>

</head>
<body>

<!-- 🔥 TOP SECTION -->
<div class="top-section">
    <div class="container">

        <h1>Student Module</h1>

        <div class="box">
            <button onclick="show('create')">Create</button>
            <button onclick="show('view')">View</button>
            <button onclick="show('update')">Update</button>
            <button onclick="show('delete')">Delete</button>
        </div>

        <!-- CREATE -->
        <div id="create" class="section">
            <input id="sid" placeholder="Student ID">

            <input id="fname" placeholder="First Name">
            <input id="lname" placeholder="Last Name">

            <input id="email" placeholder="Email">
            <input id="phone" placeholder="Phone Number">

            <input id="address" placeholder="Address">

            <input id="dob" type="date">

            <input id="year" placeholder="Enrollment Year">
            <input id="dept" placeholder="Department ID">

            <button onclick="addStudent()">Add</button>
        </div>

        <!-- VIEW -->
        <div id="view" class="section">
            <!-- 🔍 SEARCH BAR -->
            <input 
             type="text" 
             id="searchInput" 
             placeholder="Search student..." 
             onkeyup="searchStudents()"
            >
            <div id="list"></div>
        </div>

        <!-- UPDATE -->
        <div id="update" class="section">
            <input id="uid" placeholder="Student ID">

            <input id="ufname" placeholder="New First Name">
            <input id="ulname" placeholder="New Last Name">

            <input id="uemail" placeholder="New Email">
            <input id="uphone" placeholder="New Phone Number">

            <input id="uaddress" placeholder="New Address">

            <input id="udob" type="date">

            <input id="uyear" placeholder="New Enrollment Year">
            <input id="udept" placeholder="New Department ID">

            <button onclick="updateStudent()">Update</button>
        </div>

        <!-- DELETE -->
        <div id="delete" class="section">
            <input id="did" placeholder="ID">
            <button onclick="deleteStudent()">Delete</button>
        </div>

        <!-- BACK BUTTON -->
        <button class="back-btn" onclick="goBack()">Back to Dashboard</button>

    </div>
</div>

<!-- 🔥 BOTTOM SECTION (FUTURE CONTENT AREA) -->
<div class="bottom-section">
    <!-- You can add table / charts / data here later -->
</div>

<script>
const BASE_URL = "http://127.0.0.1:8000";

/* ================= AUTH HEADER ================= */
function getHeaders() {
    return {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + sessionStorage.getItem("token")
    };
}

/* ================= UI ================= */
function show(id) {
    document.querySelectorAll('.section').forEach(s => s.style.display = "none");
    document.getElementById(id).style.display = "block";

    if (id === "view") loadStudents();
}

/* ================= CREATE ================= */
async function addStudent() {
    const student = {
        FirstName: document.getElementById("fname").value,
        LastName: document.getElementById("lname").value,
        Email: document.getElementById("email").value,
        Phone_no: document.getElementById("phone").value,
        Address: document.getElementById("address").value,
        Date_of_Birth: document.getElementById("dob").value,
        EnrollmentYear: parseInt(document.getElementById("year").value),
        Dept_ID: parseInt(document.getElementById("dept").value)
    };

    try {
        const res = await fetch(`${BASE_URL}/students/`, {
            method: "POST",
            headers: getHeaders(),
            body: JSON.stringify(student)
        });

        const data = await res.json();

        if (!res.ok) throw new Error(data.detail);

        alert("Student Added Successfully");
        loadStudents();

    } catch (err) {
        alert(err.message);
    }
}

/* ================= VIEW ================= */
async function loadStudents() {
    try {
        const res = await fetch(`${BASE_URL}/students/`, {
            headers: getHeaders()
        });

        console.log("STATUS:", res.status); // debug

        if (!res.ok) {
            const err = await res.text();
            document.getElementById("list").innerHTML =
                `<p style="color:red;">${err}</p>`;
            return;
        }

        const data = await res.json();

        document.getElementById("list").innerHTML = data.map(s =>
            `<div class="student-card">
                <p><b>ID:</b> ${s.Student_ID}</p>
                <p><b>Name:</b> ${s.FirstName} ${s.LastName}</p>
                <p><b>Email:</b> ${s.Email}</p>
                <p><b>Phone:</b> ${s.Phone_no}</p>
                <p><b>DOB:</b> ${s.Date_of_Birth}</p>
                <p><b>Year:</b> ${s.EnrollmentYear}</p>
                <p><b>Dept ID:</b> ${s.Dept_ID}</p>
            </div>`
        ).join("");

    } catch (err) {
        console.error(err);
    }
}

/* ================= UPDATE ================= */
async function updateStudent() {
    const id = document.getElementById("uid").value;

    const data = {
        FirstName: document.getElementById("ufname").value,
        LastName: document.getElementById("ulname").value,
        Email: document.getElementById("uemail").value,
        Phone_no: document.getElementById("uphone").value,
        Address: document.getElementById("uaddress").value,
        Date_of_Birth: document.getElementById("udob").value,
        EnrollmentYear: document.getElementById("uyear").value,
        Dept_ID: document.getElementById("udept").value
    };

    try {
        const res = await fetch(`${BASE_URL}/students/${id}`, {
            method: "PUT",
            headers: getHeaders(),
            body: JSON.stringify(data)
        });

        const result = await res.json();

        if (!res.ok) throw new Error(result.detail);

        alert("Student Updated");
        loadStudents();

    } catch (err) {
        alert(err.message);
    }
}

/* ================= DELETE ================= */
async function deleteStudent() {
    const id = document.getElementById("did").value;

    try {
        const res = await fetch(`${BASE_URL}/students/${id}`, {
            method: "DELETE",
            headers: getHeaders()
        });

        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail);
        }

        alert("Deleted Successfully");
        loadStudents();

    } catch (err) {
        alert(err.message);
    }
}

/* ================= SEARCH ================= */
function searchStudents() {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let cards = document.querySelectorAll(".student-card");

    cards.forEach(card => {
        let text = card.innerText.toLowerCase();
        card.style.display = text.includes(input) ? "" : "none";
    });
}

/* ================= BACK ================= */
function goBack() {
    window.location.href = "index.html";
}
</script>

</body>
</html>
