<!DOCTYPE html>
<html>
<head>
<title>Department Module</title>

<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    font-family: Arial;
    color: white;

    /* 🔥 FIX: gradient stays fixed while scrolling */
    background: linear-gradient(135deg, #0f172a, #2563eb);
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-size: cover;
}

/* 🔥 TOP SECTION */
.top-section {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    height: 45vh;
}

/* CONTAINER */
.container {
    width: 650px;
    text-align: center;
    margin-top: 60px;
}

/* TITLE */
h1 {
    font-size: 34px;
    margin-bottom: 25px;
}

/* BOX */
.box {
    background: rgba(255,255,255,0.08);
    padding: 30px;
    border-radius: 14px;
}

/* INPUT */
input {
    width: 90%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 6px;
    border: none;
}

/* BUTTON */
button {
    margin: 10px;
    padding: 14px 24px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #1d4ed8;
}

/* SECTIONS */
.section {
    display: none;
    margin-top: 20px;
    background: rgba(255,255,255,0.05);
    padding: 15px;
    border-radius: 8px;
}

/* ITEM */
.item {
    background: rgba(255,255,255,0.08);
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
}

/* BACK BUTTON */
.back-btn {
    margin-top: 25px;
    padding: 12px 22px;
    font-size: 15px;
    background: #1e293b;
}

/* 🔥 BOTTOM SPACE */
.bottom-section {
    height: 55vh;
}
</style>

</head>

<body>

<!-- 🔥 TOP SECTION -->
<div class="top-section">
    <div class="container">

        <h1>Department Module</h1>

        <div class="box">
            <button id="createBtn" onclick="show('create')">Create</button>
            <button id="viewBtn" onclick="show('view')">View</button>
            <button id="updateBtn" onclick="show('update')">Update</button>
            <button id="deleteBtn" onclick="show('delete')">Delete</button>
        </div>

        <!-- CREATE -->
        <div id="create" class="section">
            <input id="deptId" placeholder="Department ID">
            <input id="deptName" placeholder="Department Name">
            <input id="deptHead" placeholder="Head of Department">
            <input id="deptLocation" placeholder="Department Location">
            <button onclick="addDept()">Add Department</button>
        </div>

        <!-- VIEW -->
        <div id="view" class="section">
            <input 
            type="text" 
            id="searchInput" 
            placeholder="Search department..." 
            onkeyup="searchDepartment()"
            >
            <div id="list"></div>
        </div>

        <!-- UPDATE -->
        <div id="update" class="section">
            <input id="uid" placeholder="Department ID">
            <input id="uname" placeholder="New Department Name">
            <input id="uhead" placeholder="New Head">
            <input id="ulocation" placeholder="New Location">
            <button onclick="updateDept()">Update</button>
        </div>

        <!-- DELETE -->
        <div id="delete" class="section">
            <input id="did" placeholder="Department ID">
            <button onclick="deleteDept()">Delete</button>
        </div>

        <button class="back-btn" onclick="goBack()">Back to Dashboard</button>

    </div>
</div>

<!-- 🔥 BOTTOM SECTION -->
<div class="bottom-section"></div>

<script>
const BASE_URL = "http://127.0.0.1:8000";

/* ================= AUTH ================= */

function getAuthHeaders() {
    return {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + sessionStorage.getItem("token")
    };
}

function checkAuth() {
    if (!sessionStorage.getItem("token")) {
        alert("Please login first");
        window.location.href = "login.html";
    }
}

/* ================= INIT ================= */

window.onload = function () {
    checkAuth();
    applyRoleAccess();
};

/* ================= SWITCH ================= */

function show(id) {
    document.querySelectorAll('.section').forEach(s => s.style.display = "none");
    document.getElementById(id).style.display = "block";

    if (id === "view") loadDept();
}

/* ================= CREATE ================= */

async function addDept() {
    const dept = {
    Dept_Name: document.getElementById("deptName").value,
    HOD_Name: document.getElementById("deptHead").value,
    Location: document.getElementById("deptLocation").value   // ✅ NEW
};

    try {
        const res = await fetch(`${BASE_URL}/department/`, {
            method: "POST",
            headers: getAuthHeaders(),
            body: JSON.stringify(dept)
        });

        if (res.status === 401) throw new Error("Unauthorized (Faculty only)");

        if (!res.ok) {
            const err = await res.json();
            throw new Error(err.detail || "Failed to add department");
        }

        alert("Department Added");
        loadDept();

    } catch (err) {
        alert(err.message);
    }
}

/* ================= VIEW ================= */

async function loadDept() {
    try {
        const res = await fetch(`${BASE_URL}/department/`, {
            headers: getAuthHeaders()
        });

        if (res.status === 401) throw new Error("Session expired");

        const data = await res.json();

        if (!data.length) {
            document.getElementById("list").innerHTML = "<p>No departments found</p>";
            return;
        }

        document.getElementById("list").innerHTML = data.map(d =>
            `<div class="item department-card">
                <b>ID:</b> ${d.Dept_ID}<br>
                <b>Name:</b> ${d.Dept_Name}<br>
                <b>Head:</b> ${d.HOD_Name || ""}<br>
                <b>Location:</b> ${d.Location || ""}   <!-- ✅ NEW -->
            </div>`
        ).join("");

    } catch (err) {
        document.getElementById("list").innerHTML =
            `<p style="color:red;">${err.message}</p>`;
    }
}

/* ================= UPDATE ================= */

async function updateDept() {
    const id = document.getElementById("uid").value;

    const updated = {
        Dept_Name: document.getElementById("uname").value,
        HOD_Name: document.getElementById("uhead").value,
        Location: document.getElementById("ulocation").value   // ✅ NEW
    };

    try {
        const res = await fetch(`${BASE_URL}/department/${id}`, {
            method: "PUT",
            headers: getAuthHeaders(),
            body: JSON.stringify(updated)
        });

        if (res.status === 401) throw new Error("Unauthorized (Faculty only)");

        if (!res.ok) throw new Error("Update failed");

        alert("Updated");
        loadDept();

    } catch (err) {
        alert(err.message);
    }
}

/* ================= DELETE ================= */

async function deleteDept() {
    const id = document.getElementById("did").value;

    try {
        const res = await fetch(`${BASE_URL}/department/${id}`, {
            method: "DELETE",
            headers: getAuthHeaders()
        });

        if (res.status === 401) throw new Error("Unauthorized (Faculty only)");

        if (!res.ok) throw new Error("Delete failed");

        alert("Deleted");
        loadDept();

    } catch (err) {
        alert(err.message);
    }
}

/* ================= SEARCH ================= */

function searchDepartment() {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let cards = document.querySelectorAll(".department-card");

    cards.forEach(card => {
        let text = card.innerText.toLowerCase();
        card.style.display = text.includes(input) ? "" : "none";
    });
}

function applyRoleAccess() {
    const role = sessionStorage.getItem("role")?.toLowerCase();

    console.log("ROLE:", role); // debug

    if (role !== "faculty") {
        document.getElementById("createBtn").style.display = "none";
        document.getElementById("updateBtn").style.display = "none";
        document.getElementById("deleteBtn").style.display = "none";
    }
}

/* ================= BACK ================= */

function goBack() {
    window.location.href = "index.html";
}
</script>

</body>
</html>
