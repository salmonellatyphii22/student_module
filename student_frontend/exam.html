<!DOCTYPE html>
<html>
<head>
<title>Exams Module</title>

<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    font-family: Arial;
    color: white;

    /* 🔥 FIX: gradient stays fixed while scrolling */
    background: linear-gradient(135deg, #0f172a, #2563eb);
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-size: cover;
}

/* TOP SECTION */
.top-section {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    height: 45vh;
}

/* CONTAINER */
.container {
    width: 650px;
    text-align: center;
    margin-top: 60px;
}

/* TITLE */
h1 {
    font-size: 34px;
    margin-bottom: 25px;
}

/* BUTTON BOX */
.box {
    background: rgba(255,255,255,0.08);
    padding: 30px;
    border-radius: 14px;
}

/* INPUT + SELECT */
input, select {
    width: 90%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 6px;
    border: none;
    box-sizing: border-box;
    background: #e5e7eb;
    color: black;
}

/* BUTTON */
button {
    margin: 10px;
    padding: 14px 24px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #1d4ed8;
}

/* SECTION */
.section {
    display: none;
    margin-top: 20px;
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 10px;
}

/* ITEM (VIEW CARD) */
.item {
    background: rgba(255,255,255,0.08);
    padding: 15px;
    margin: 15px 0;
    border-radius: 8px;
    text-align: left;
}

/* BACK BUTTON */
.back-btn {
    margin-top: 25px;
    background: #1e293b;
}

/* BOTTOM */
.bottom-section {
    height: 55vh;
}
</style>

</head>

<body>

<div class="top-section">
<div class="container">

<h1>Exams Module</h1>

<!-- ACTION BUTTONS -->
<div class="box">
    <button id="createBtn" onclick="show('create')">Create</button>
    <button id="viewBtn" onclick="show('view')">View</button>
    <button id="updateBtn" onclick="show('update')">Update</button>
    <button id="deleteBtn" onclick="show('delete')">Delete</button>
</div>

<!-- CREATE -->
<div id="create" class="section">
    <input id="examId" placeholder="Exam ID">

    <select id="examType">
        <option value="">Select Exam Type</option>
        <option>Midterm</option>
        <option>Final</option>
        <option>Practical</option>
    </select>

    <input type="date" id="examDate">
    <input id="marks" placeholder="Total Marks">
    <input id="facultyId" placeholder="Faculty ID">

    <button onclick="addExam()">Add Exam</button>
</div>

<!-- VIEW -->
<div id="view" class="section">
    <div id="list"></div>
</div>

<!-- UPDATE -->
<div id="update" class="section">
    <input id="uid" placeholder="Exam ID">

    <select id="utype">
        <option value="">New Exam Type</option>
        <option>Midterm</option>
        <option>Final</option>
        <option>Practical</option>
    </select>

    <input type="date" id="udate">
    <input id="umarks" placeholder="New Marks">

    <button onclick="updateExam()">Update</button>
</div>

<!-- DELETE -->
<div id="delete" class="section">
    <input id="did" placeholder="Exam ID">
    <button onclick="deleteExam()">Delete</button>
</div>

<button class="back-btn" onclick="goBack()">Back to Dashboard</button>

</div>
</div>

<div class="bottom-section"></div>

<script>
const BASE_URL = "http://127.0.0.1:8000";

/* ================= AUTH ================= */

function getAuthHeaders() {
    return {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + sessionStorage.getItem("token")
    };
}

function checkAuth() {
    if (!sessionStorage.getItem("token")) {
        alert("Please login first");
        window.location.href = "login.html";
    }
}

/* ================= SWITCH ================= */

function show(id) {
    document.querySelectorAll('.section').forEach(s => s.style.display = "none");
    document.getElementById(id).style.display = "block";

    if (id === "view") loadExams();
}

/* ================= CREATE ================= */

async function addExam() {
    const exam = {
        Exam_Type: document.getElementById("examType").value,
        Exam_Date: document.getElementById("examDate").value,
        Total_Marks: Number(document.getElementById("marks").value),
        Faculty_ID: Number(document.getElementById("facultyId").value)
    };

    try {
        const res = await fetch(`${BASE_URL}/exams/`, {   // ✅ FIXED
            method: "POST",
            headers: getAuthHeaders(),
            body: JSON.stringify(exam)
        });

        const data = await res.json();

        if (!res.ok) {
            alert("❌ Error: " + JSON.stringify(data.detail));
            return;
        }

        alert("✅ Exam Added Successfully!");

        document.getElementById("examType").value = "";
        document.getElementById("examDate").value = "";
        document.getElementById("marks").value = "";
        document.getElementById("facultyId").value = "";

        loadExams();

    } catch (err) {
        alert("❌ Server Error: " + err.message);
    }
}

/* ================= VIEW ================= */

async function loadExams() {
    try {
        const res = await fetch(`${BASE_URL}/exams/`, {   // ✅ FIXED
            headers: getAuthHeaders()
        });

        if (!res.ok) throw new Error("Unauthorized");

        const data = await res.json();

        document.getElementById("list").innerHTML = data.map(e => `
            <div class="item exam-card">
                <b>ID:</b> ${e.Exam_ID}<br>
                <b>Type:</b> ${e.Exam_Type}<br>
                <b>Date:</b> ${e.Exam_Date}<br>
                <b>Total Marks:</b> ${e.Total_Marks}<br>
                <b>Faculty ID:</b> ${e.Faculty_ID}
            </div>
        `).join("");

    } catch (err) {
        document.getElementById("list").innerHTML =
            `<p style="color:red;">${err.message}</p>`;
    }
}

/* ================= UPDATE ================= */

async function updateExam() {
    const id = document.getElementById("uid").value;

    const updated = {
        Exam_Type: document.getElementById("utype").value,
        Exam_Date: document.getElementById("udate").value,
        Total_Marks: document.getElementById("umarks").value 
            ? Number(document.getElementById("umarks").value) 
            : undefined,
        Faculty_ID: document.getElementById("ufaculty").value 
            ? Number(document.getElementById("ufaculty").value) 
            : undefined
    };

    try {
        const res = await fetch(`${BASE_URL}/exams/${id}`, {   // ✅ FIXED
            method: "PUT",
            headers: getAuthHeaders(),
            body: JSON.stringify(updated)
        });

        const data = await res.json();

        if (!res.ok) {
            alert("❌ Error: " + JSON.stringify(data.detail));
            return;
        }

        alert("Updated ✅");
        loadExams();

    } catch (err) {
        alert(err.message);
    }
}

/* ================= DELETE ================= */

async function deleteExam() {
    const id = document.getElementById("did").value;

    try {
        const res = await fetch(`${BASE_URL}/exams/${id}`, {   // ✅ FIXED
            method: "DELETE",
            headers: getAuthHeaders()
        });

        if (!res.ok) {
            const data = await res.json();
            throw new Error(data.detail || "Delete failed");
        }

        alert("Deleted ✅");
        loadExams();

    } catch (err) {
        alert(err.message);
    }
}

/* ================= BACK ================= */

function goBack() {
    window.location.href = "index.html";
}

function applyRoleAccess() {
    const role = sessionStorage.getItem("role")?.toLowerCase();

    console.log("ROLE:", role);

    if (role === "student") {
        document.getElementById("createBtn").style.display = "none";
        document.getElementById("updateBtn").style.display = "none";
        document.getElementById("deleteBtn").style.display = "none";
    }
}

/* ================= INIT ================= */

window.onload = function () {
    checkAuth();
    applyRoleAccess();
};

</script>

</body>
</html>
