<!DOCTYPE html>
<html>
<head>
<title>Faculty Module</title>

<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    font-family: Arial;
    color: white;

    /* 🔥 FIX: gradient stays fixed while scrolling */
    background: linear-gradient(135deg, #0f172a, #2563eb);
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-size: cover;
}

/* 🔥 TOP SECTION */
.top-section {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    height: 45vh;
}

/* CONTAINER */
.container {
    width: 650px;
    text-align: center;
    margin-top: 60px;
}

/* TITLE */
h1 {
    font-size: 34px;
    margin-bottom: 25px;
}

/* BOX */
.box {
    background: rgba(255,255,255,0.08);
    padding: 30px;
    border-radius: 14px;
}

/* INPUT */
input {
    width: 90%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 6px;
    border: none;
}

/* BUTTON */
button {
    margin: 10px;
    padding: 14px 24px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #1d4ed8;
}

/* SECTIONS */
.section {
    display: none;
    margin-top: 20px;
    background: rgba(255,255,255,0.05);
    padding: 15px;
    border-radius: 8px;
}

/* ITEM */
.item {
    background: rgba(255,255,255,0.08);
    padding: 10px;
    margin: 8px 0;
    border-radius: 6px;
}

/* BACK BUTTON */
.back-btn {
    margin-top: 25px;
    padding: 12px 22px;
    font-size: 15px;
    background: #1e293b;
}

/* 🔥 BOTTOM SECTION */
.bottom-section {
    height: 55vh;
}
</style>

</head>

<body>

<!-- 🔥 TOP SECTION -->
<div class="top-section">
    <div class="container">

        <h1>Faculty Module</h1>

        <div class="box">
            <button id="createBtn" onclick="show('create')">Create</button>
            <button id="viewBtn" onclick="show('view')">View</button>
            <button id="updateBtn" onclick="show('update')">Update</button>
            <button id="deleteBtn" onclick="show('delete')">Delete</button>
        </div>

        <!-- CREATE -->
        <div id="create" class="section">
            <input id="facultyId" placeholder="Faculty ID">

            <input id="facultyName" placeholder="Name">
            <input id="facultyEmail" placeholder="Email">

            <input id="facultyPhone" placeholder="Phone Number">
            <input id="facultyDesignation" placeholder="Designation">

            <input id="facultySalary" placeholder="Salary">
            <input id="facultyDept" placeholder="Department ID">

            <button onclick="addFaculty()">Add Faculty</button>
        </div>

        <!-- VIEW -->
        <div id="view" class="section">
            <input 
            type="text" 
            id="searchInput" 
            placeholder="Search faculty..." 
            onkeyup="searchFaculty()"
            >
            <div id="list"></div>
        </div>

        <!-- UPDATE -->
        <div id="update" class="section">
            <input id="uid" placeholder="Faculty ID">

            <input id="uname" placeholder="New Name">
            <input id="uemail" placeholder="New Email">

            <input id="uphone" placeholder="New Phone">
            <input id="udesignation" placeholder="New Designation">

            <input id="usalary" placeholder="New Salary">
            <input id="udept" placeholder="New Dept ID">

            <button onclick="updateFaculty()">Update</button>
        </div>

        <!-- DELETE -->
        <div id="delete" class="section">
            <input id="did" placeholder="Faculty ID">
            <button onclick="deleteFaculty()">Delete</button>
        </div>

        <button class="back-btn" onclick="goBack()">Back to Dashboard</button>

    </div>
</div>

<!-- 🔥 BOTTOM SECTION -->
<div class="bottom-section"></div>

<script>
const BASE_URL = "http://127.0.0.1:8000";

/* ================= AUTH ================= */

function getAuthHeaders() {
    return {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + sessionStorage.getItem("token")
    };
}

function checkAuth() {
    if (!sessionStorage.getItem("token")) {
        alert("Please login first");
        window.location.href = "login.html";
    }
}

/* ================= SWITCH ================= */

function show(id) {
    document.querySelectorAll('.section').forEach(s => s.style.display = "none");
    document.getElementById(id).style.display = "block";

    if (id === "view") loadFaculty();
}

/* ================= CREATE ================= */

async function addFaculty() {
    const faculty = {
        Name: document.getElementById("facultyName").value,
        Email: document.getElementById("facultyEmail").value,
        Phone_no: document.getElementById("facultyPhone").value,
        Designation: document.getElementById("facultyDesignation").value,
        Salary: Number(document.getElementById("facultySalary").value),
        Dept_ID: Number(document.getElementById("facultyDept").value)
    };

    try {
        const res = await fetch(`${BASE_URL}/faculty/`, {
            method: "POST",
            headers: getAuthHeaders(),
            body: JSON.stringify(faculty)
        });

        const data = await res.json();

        if (!res.ok) {
            throw new Error(JSON.stringify(data.detail));
        }

        alert("Faculty Added ✅");
        loadFaculty();

    } catch (err) {
        alert(err.message);
    }
}

/* ================= VIEW ================= */

async function loadFaculty() {
    try {
        const res = await fetch(`${BASE_URL}/faculty/`, {
            headers: getAuthHeaders()
        });

        if (!res.ok) throw new Error("Unauthorized");

        const data = await res.json();

        document.getElementById("list").innerHTML = data.map(f =>
            `<div class="item faculty-card" style="text-align:left;">
                <p><b>ID:</b> ${f.Faculty_ID}</p>
                <p><b>Name:</b> ${f.Name}</p>   <!-- ✅ FIX -->
                <p><b>Email:</b> ${f.Email}</p>
                <p><b>Phone:</b> ${f.Phone_no || ""}</p>
                <p><b>Designation:</b> ${f.Designation || ""}</p>
                <p><b>Salary:</b> ${f.Salary ?? ""}</p>
                <p><b>Dept ID:</b> ${f.Dept_ID}</p>
            </div>`
        ).join("");

    } catch (err) {
        document.getElementById("list").innerHTML =
            `<p style="color:red;">${err.message}</p>`;
    }
}

/* ================= UPDATE ================= */

async function updateFaculty() {
    const id = document.getElementById("uid").value;

    const updated = {
        Name: document.getElementById("uname").value,   // ✅ FIX
        Email: document.getElementById("uemail").value,
        Phone_no: document.getElementById("uphone").value,
        Designation: document.getElementById("udesignation").value,
        Salary: document.getElementById("usalary").value 
            ? Number(document.getElementById("usalary").value) 
            : null,
        Dept_ID: document.getElementById("udept").value 
            ? Number(document.getElementById("udept").value) 
            : null
    };

    try {
        const res = await fetch(`${BASE_URL}/faculty/${id}`, {
            method: "PUT",
            headers: getAuthHeaders(),
            body: JSON.stringify(updated)
        });

        const data = await res.json();

        if (!res.ok) {
            throw new Error(JSON.stringify(data.detail));
        }

        alert("Updated ✅");
        loadFaculty();

    } catch (err) {
        alert(err.message);
    }
}

/* ================= DELETE ================= */

async function deleteFaculty() {
    const id = document.getElementById("did").value;

    try {
        const res = await fetch(`${BASE_URL}/faculty/${id}`, {
            method: "DELETE",
            headers: getAuthHeaders()
        });

        if (!res.ok) {
            const data = await res.json();
            throw new Error(data.detail || "Delete failed");
        }

        alert("Deleted ✅");
        loadFaculty();

    } catch (err) {
        alert(err.message);
    }
}

/* ================= SEARCH ================= */

function searchFaculty() {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let cards = document.querySelectorAll(".faculty-card");

    cards.forEach(card => {
        let text = card.innerText.toLowerCase();

        card.style.display = text.includes(input) ? "" : "none";
    });
}

/* ================= BACK ================= */

function goBack() {
    window.location.href = "index.html";
}

function applyRoleAccess() {
    const role = sessionStorage.getItem("role")?.toLowerCase();

    console.log("ROLE:", role);

    if (role === "student") {
        // hide faculty actions
        document.getElementById("createBtn").style.display = "none";
        document.getElementById("updateBtn").style.display = "none";
        document.getElementById("deleteBtn").style.display = "none";
    }
}

/* ================= INIT ================= */

window.onload = function () {
    checkAuth();
    applyRoleAccess();
};

</script>

</body>
</html>
