<!DOCTYPE html>
<html>
<head>
<title>Courses Module</title>

<style>
html, body {
    height: 100%;
    margin: 0;
}

body {
    font-family: Arial;
    color: white;

    /* 🔥 FIX: gradient stays fixed while scrolling */
    background: linear-gradient(135deg, #0f172a, #2563eb);
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-size: cover;
}

/* 🔥 TOP SECTION */
.top-section {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    height: 45vh;
}

/* CONTAINER */
.container {
    width: 650px;
    text-align: center;
    margin-top: 60px;
}

/* TITLE */
h1 {
    font-size: 34px;
    margin-bottom: 25px;
}

/* BOX */
.box {
    background: rgba(255,255,255,0.08);
    padding: 30px;
    border-radius: 14px;
}

/* 🔥 INPUT + SELECT (FIXED) */
input, select {
    width: 90%;
    padding: 12px;
    margin: 10px 0;

    border-radius: 6px;
    border: none;

    box-sizing: border-box;   /* ✅ SAME SIZE */
    font-size: 14px;
    font-family: Arial;

    background: #e5e7eb;      /* ✅ same color */
    color: #000;
}

/* 🔥 FIX SELECT HEIGHT + STYLE */
select {
    width: 90%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 6px;
    border: none;

    box-sizing: border-box;
    font-size: 14px;
    font-family: Arial;

    background: #e5e7eb;
    color: #000;

    height: 44px;
    cursor: pointer;
}

/* BUTTON */
button {
    margin: 10px;
    padding: 14px 24px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #1d4ed8;
}

/* SECTIONS */
.section {
    display: none;
    margin-top: 20px;
    background: rgba(255,255,255,0.05);
    padding: 15px;
    border-radius: 8px;
}

/* ITEM */
.item {
    background: rgba(255,255,255,0.08);
    padding: 12px;
    margin: 12px 0;          /* 🔥 better spacing */
    border-radius: 6px;
    text-align: left;        /* 🔥 FIX alignment */
}

/* BACK BUTTON */
.back-btn {
    margin-top: 25px;
    padding: 12px 22px;
    font-size: 15px;
    background: #1e293b;
}

/* 🔥 BOTTOM SECTION */
.bottom-section {
    height: 55vh;
}
</style>

</head>

<body>

<!-- 🔥 TOP SECTION -->
<div class="top-section">
    <div class="container">

        <h1>Courses Module</h1>

        <div class="box">
            <button id="createBtn" onclick="show('create')">Create</button>
            <button id="viewBtn" onclick="show('view')">View</button>
            <button id="updateBtn" onclick="show('update')">Update</button>
            <button id="deleteBtn" onclick="show('delete')">Delete</button>
        </div>

        <!-- CREATE -->
        <div id="create" class="section">
            <input id="courseId" placeholder="Course ID">

            <input id="courseName" placeholder="Course Name">

            <input id="credits" placeholder="Credits (e.g. 3)">
            <input id="semester" placeholder="Semester (e.g. 1)">

            <!-- Course Type Dropdown -->
            <select id="courseType">
                <option value="">Select Course Type</option>
                <option>Core</option>
                <option>Elective</option>
            </select>

            <input id="facultyId" placeholder="Faculty ID">

            <button onclick="addCourse()">Add Course</button>
        </div>

        <!-- VIEW -->
        <div id="view" class="section">
            <input 
            type="text" 
            id="searchInput" 
            placeholder="Search course..." 
            onkeyup="searchCourse()"
            >
            <div id="list"></div>
        </div>

        <!-- UPDATE -->
        <div id="update" class="section">
            <input id="uid" placeholder="Course ID">

            <input id="uname" placeholder="New Course Name">
            <input id="ucredits" placeholder="New Credits">

            <input id="usemester" placeholder="New Semester">

            <select id="utype">
                <option value="">Select Type</option>
                <option>Core</option>
                <option>Elective</option>
            </select>

            <input id="ufaculty" placeholder="New Faculty ID">

            <button onclick="updateCourse()">Update</button>
        </div>

        <!-- DELETE -->
        <div id="delete" class="section">
            <input id="did" placeholder="Course ID">
            <button onclick="deleteCourse()">Delete</button>
        </div>

        <button class="back-btn" onclick="goBack()">Back to Dashboard</button>

    </div>
</div>

<!-- 🔥 BOTTOM SECTION -->
<div class="bottom-section"></div>

<script>
const BASE_URL = "http://127.0.0.1:8000";

/* ================= AUTH ================= */

function getAuthHeaders() {
    return {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + sessionStorage.getItem("token")
    };
}

function checkAuth() {
    if (!sessionStorage.getItem("token")) {
        alert("Please login first");
        window.location.href = "login.html";
    }
}

/* ================= SWITCH ================= */

function show(id) {
    document.querySelectorAll('.section').forEach(s => s.style.display = "none");
    document.getElementById(id).style.display = "block";

    if (id === "view") loadCourses();
}

/* ================= CREATE ================= */

async function addCourse() {
    const course = {
        Course_Name: document.getElementById("courseName").value,
        Credits: Number(document.getElementById("credits").value),
        Course_Type: document.getElementById("courseType").value,
        Semester: document.getElementById("semester").value 
            ? Number(document.getElementById("semester").value) 
            : null,
        Faculty_ID: document.getElementById("facultyId").value 
            ? Number(document.getElementById("facultyId").value) 
            : null
    };

    try {
        const res = await fetch(`${BASE_URL}/courses/`, {
            method: "POST",
            headers: getAuthHeaders(),
            body: JSON.stringify(course)
        });

        const data = await res.json();

        if (!res.ok) {
            alert("❌ Error: " + JSON.stringify(data.detail));
            return;
        }

        // ✅ SUCCESS MESSAGE (NOW YOU WILL SEE IT)
        alert("✅ Course Added Successfully!");

        // optional: clear form
        document.getElementById("courseName").value = "";
        document.getElementById("credits").value = "";
        document.getElementById("semester").value = "";
        document.getElementById("facultyId").value = "";

        loadCourses();

    } catch (err) {
        alert("❌ Server Error: " + err.message);
    }
}

/* ================= VIEW ================= */

async function loadCourses() {
    try {
        const res = await fetch(`${BASE_URL}/courses/`, {
            headers: getAuthHeaders()
        });

        if (!res.ok) throw new Error("Unauthorized");

        const data = await res.json();

        document.getElementById("list").innerHTML = data.map(c =>
            `<div class="item course-card">
                <p><b>ID:</b> ${c.Course_ID}</p>
                <p><b>Name:</b> ${c.Course_Name}</p>
                <p><b>Credits:</b> ${c.Credits}</p>
                <p><b>Semester:</b> ${c.Semester ?? ""}</p>
                <p><b>Type:</b> ${c.Course_Type}</p>
                <p><b>Faculty ID:</b> ${c.Faculty_ID ?? ""}</p>
            </div>`
        ).join("");

    } catch (err) {
        document.getElementById("list").innerHTML =
            `<p style="color:red;">${err.message}</p>`;
    }
}

/* ================= UPDATE ================= */

async function updateCourse() {
    const id = document.getElementById("uid").value;

    const updated = {
        Course_Name: document.getElementById("uname").value,
        Credits: document.getElementById("ucredits").value 
            ? Number(document.getElementById("ucredits").value) 
            : undefined,
        Semester: document.getElementById("usemester").value 
            ? Number(document.getElementById("usemester").value) 
            : undefined,
        Course_Type: document.getElementById("utype").value,
        Faculty_ID: document.getElementById("ufaculty").value 
            ? Number(document.getElementById("ufaculty").value) 
            : undefined
    };

    try {
        const res = await fetch(`${BASE_URL}/courses/${id}`, {
            method: "PUT",
            headers: getAuthHeaders(),
            body: JSON.stringify(updated)
        });

        const data = await res.json();

        if (!res.ok) {
            throw new Error(JSON.stringify(data.detail));
        }

        alert("Updated ✅");
        loadCourses();

    } catch (err) {
        alert(err.message);
    }
}

/* ================= DELETE ================= */

async function deleteCourse() {
    const id = document.getElementById("did").value;

    try {
        const res = await fetch(`${BASE_URL}/courses/${id}`, {
            method: "DELETE",
            headers: getAuthHeaders()
        });

        if (!res.ok) {
            const data = await res.json();
            throw new Error(data.detail || "Delete failed");
        }

        alert("Deleted ✅");
        loadCourses();

    } catch (err) {
        alert(err.message);
    }
}

/* ================= SEARCH ================= */

function searchCourse() {
    let input = document.getElementById("searchInput").value.toLowerCase();
    let cards = document.querySelectorAll(".course-card");

    cards.forEach(card => {
        let text = card.innerText.toLowerCase();
        card.style.display = text.includes(input) ? "" : "none";
    });
}

/* ================= INIT ================= */

window.onload = function () {
    checkAuth();
    applyRoleAccess();
};

function applyRoleAccess() {
    const role = sessionStorage.getItem("role")?.toLowerCase();

    console.log("ROLE:", role);

    if (role === "student") {
        document.getElementById("createBtn").style.display = "none";
        document.getElementById("updateBtn").style.display = "none";
        document.getElementById("deleteBtn").style.display = "none";
    }
}

/* ================= BACK ================= */

function goBack() {
    window.location.href = "index.html";
}
</script>

</body>
</html>
